name: poker-ai

services:
  poker-ai:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: poker-ai:local
    container_name: poker-ai
    restart: unless-stopped
    ports:
      - "${POKER_AI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
