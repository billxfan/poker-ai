name: PokerAI
options:
  bundleIdPrefix: com.pokerai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.12.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.3.0

targets:
  PokerAI:
    type: application
    platform: iOS
    sources:
      - src
      - PokerAI/Assets.xcassets
      - PokerAI/PrivacyInfo.xcprivacy
      - GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleMobileAds
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokerai.trainer
        INFOPLIST_KEY_CFBundleDisplayName: 德扑AI训练器
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: PokerAI/Info.plist
      properties:
        CFBundleDisplayName: 德扑AI训练器
        CFBundleName: PokerAI
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        GADApplicationIdentifier: ca-app-pub-4141888691603158~7766666763
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  PokerAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PokerAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokerai.trainer.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  PokerAI:
    build:
      targets:
        PokerAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PokerAITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
